name: Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的使用场景
      description: 现在哪里不方便？希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？可以附草图或参考软件。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 涉及翻译接口 / 网络
        - label: 涉及 UI / 动画
        - label: 涉及生词本 / 数据
        - label: 涉及安装 / 打包
